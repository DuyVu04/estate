services:
  db:
    image: postgres:16-alpine
    container_name: estate-db
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: duyvu
      POSTGRES_PASSWORD: 123456789
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duyvu -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend-network

  estate-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: estate-service
    ports:
      - "8081:8080"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-network

volumes:
  pgdata:

networks:
  backend-network:
    driver: bridge
