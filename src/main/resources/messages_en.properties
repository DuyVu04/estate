INVALID_USERNAME_OR_PASSWORD=Username or password invalid
INVALID_VERIFICATION_TOKEN=Verification token is invalid or expired
TOKEN_EXPIRED=Token expired
INVALID_REFRESH_TOKEN=Invalid refresh token
REFRESH_TOKEN_REVOKED=Refresh token is revoked or reused. All sessions terminated.
REFRESH_TOKEN_EXPIRED=Refresh token expired
EMAIL_SENDING_FAILED=Failed to send email
ROLE_NOT_FOUND=Role not found
PROPERTY_NOT_FOUND=Property not found
UNAUTHENTICATED=Unauthenticated
ACCESS_DENIED=Access denied
RESOURCE_NOT_FOUND=Resource not found
TOO_MANY_REQUESTS=Too many login attempts. Please try again later.
PROPERTY_NOT_AVAILABLE=Property not available
PROPERTY_ALREADY_RESERVED=Property is already reserved
INVALID_STATE_TRANSITION=Invalid workflow state transition
UNAUTHORIZED_WORKFLOW_ACTOR=Actor is not authorized for this workflow transition
