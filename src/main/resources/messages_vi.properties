# ========================================================
# ESTATE APPLICATION - I18N MESSAGES (VIETNAMESE)
# ========================================================

# Enum Key Mappings
SUCCESS=Thành công
INVALID_REQUEST=Yêu cầu không hợp lệ
VALIDATION_ERROR=Dữ liệu không hợp lệ
USER_NOT_FOUND=Không tìm thấy người dùng
EMAIL_ALREADY_EXISTS=Email đã tồn tại trong hệ thống
PHONE_ALREADY_EXISTS=Số điện thoại đã tồn tại
INVALID_PASSWORD=Mật khẩu không đúng định dạng
EMAIL_NOT_VERIFIED=Email chưa được xác thực
EMAIL_ALREADY_VERIFIED=Email đã được xác thực trước đó
INVALID_USERNAME_OR_PASSWORD=Tên đăng nhập hoặc mật khẩu không chính xác
INVALID_VERIFICATION_TOKEN=Mã xác thực không hợp lệ hoặc đã hết hạn
TOKEN_EXPIRED=Mã xác thực đã hết hạn
INVALID_REFRESH_TOKEN=Refresh token không hợp lệ
REFRESH_TOKEN_REVOKED=Refresh token đã bị thu hồi hoặc tái sử dụng. Tất cả phiên đăng nhập đã bị chấm dứt.
REFRESH_TOKEN_EXPIRED=Refresh token đã hết hạn
EMAIL_SENDING_FAILED=Gửi email thất bại
ROLE_NOT_FOUND=Không tìm thấy vai trò
PROPERTY_NOT_FOUND=Không tìm thấy bất động sản
UNAUTHENTICATED=Phiên đăng nhập đã hết hạn
ACCESS_DENIED=Bạn không có quyền thực hiện thao tác này
RESOURCE_NOT_FOUND=Tài nguyên không tồn tại
TOO_MANY_REQUESTS=Quá nhiều lần thử đăng nhập. Vui lòng thử lại sau.
PROPERTY_NOT_AVAILABLE=Bất động sản hiện không khả dụng
PROPERTY_ALREADY_RESERVED=Bất động sản đã có người đặt cọc trước
INVALID_STATE_TRANSITION=Quy trình chuyển trạng thái không hợp lệ
UNAUTHORIZED_WORKFLOW_ACTOR=Bạn không có quyền thực hiện bước cọc này
PAYMENT_NOT_FOUND=Không tìm thấy thông tin thanh toán
PAYMENT_ALREADY_PROCESSED=Giao dịch thanh toán đã được xử lý
INVALID_PAYMENT_AMOUNT=Số tiền thanh toán không khớp với tiền cọc
CONCURRENT_REQUEST=Bất động sản đang được người khác xử lý, vui lòng thử lại sau.
INTERNAL_SERVER_ERROR=Lỗi máy chủ nội bộ

