spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/my-estate
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      max-lifetime: 300000
      idle-timeout: 60000
      validation-timeout: 5000
      minimum-idle: 5
      maximum-pool-size: 20
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sendgrid:
    api-key: ${SENDGRID_API_KEY}
    from-email: ${SENDGRID_FROM_EMAIL}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  mail:
    from: ${SPRING_MAIL_FROM}
    port: ${SPRING_MAIL_PORT}
    host: ${SPRING_MAIL_HOST}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  data:
    redis:
      host: localhost
      port: 6380
      database: 0
      timeout: 5s
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        acknowledge-mode: manual

jwt:
  secret : ${SECRET_KEY}
  expiration : ${EXPIRATION}
  refresh-expiration : ${REFRESH_EXPIRATION}

openapi:
  service:
    title: Estate API
    version: 1.0.0
    server: http://localhost:8080/api
    api-docs: estate-service

rabbitmq:
  exchange:
    email: email.exchange
    dlq: email.dead.exchange
    retry: email.retry.exchange
  queue:
    email: email.queue
    dlq: email.dead.queue
    retry: email.retry.queue
  routing-key:
    email: email.verify
    dlq: email.dead
    retry: email.retry


app:
  rate-limit:
    login:
      max-attempts: 5
      duration: 1m

default-admin: ${DEFAULT_ADMIN_USERNAME}