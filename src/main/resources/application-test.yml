spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:my-estate}
    username: ${DB_USER:duyvu}
    password: ${DB_PASSWORD:123456789}
    driver-class-name: org.postgresql.Driver
    hikari:
      max-lifetime: 300000
      idle-timeout: 60000
      validation-timeout: 5000
      minimum-idle: 5
      maximum-pool-size: 20
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sendgrid:
    api-key: ${SENDGRID_API_KEY:SG.placeholder}
    from-email: ${SENDGRID_FROM_EMAIL:test@example.com}
  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true
  mail:
    from: ${SPRING_MAIL_FROM:test@example.com}
    port: ${SPRING_MAIL_PORT:587}
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    username: ${SPRING_MAIL_USERNAME:test@example.com}
    password: ${SPRING_MAIL_PASSWORD:password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      database: 0
      timeout: 5s
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        acknowledge-mode: manual

jwt:
  secret : ${SECRET_KEY:f513f80749396f4fbad6e62e4a40cf013b3cd86e4ffc88b7c39a075ac656f235}
  expiration : ${EXPIRATION:3600000}
  refresh-expiration : ${REFRESH_EXPIRATION:86400000}

openapi:
  service:
    title: Estate API
    version: 1.0.0
    server: http://localhost:8080/api
    api-docs: estate-service

rabbitmq:
  exchange:
    email: email.exchange
    dlq: email.dead.exchange
    retry: email.retry.exchange
  queue:
    email: email.queue
    dlq: email.dead.queue
    retry: email.retry.queue
  routing-key:
    email: email.verify
    dlq: email.dead
    retry: email.retry


app:
  rate-limit:
    login:
      max-attempts: 5
      duration: 1m
  lock:
    reservation-wait-time-seconds: 3

default-admin: ${DEFAULT_ADMIN_USERNAME:admin}